<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172f31">
  <title>Αθήνα και ελληνικός πολιτισμός · WebXR</title>
</head>
<body class="interface-collapsed">
  <main class="experience" aria-label="Αθήνα και ελληνικός πολιτισμός">
    <canvas id="world" aria-label="Αρχαία Αθήνα με την Ακρόπολη στο βάθος"></canvas>
    <button id="menu" class="menu-toggle" type="button" aria-haspopup="dialog" aria-controls="menu-dialog" aria-expanded="false">Μενού</button>
    <span id="reticle" aria-hidden="true" hidden></span>
    <button id="fire-button" type="button" aria-label="Κράτησε για να ρίξεις νερό στο στόχαστρο" aria-pressed="false" hidden>
      <span aria-hidden="true">◉</span><span>Νερό</span>
    </button>
    <div id="touch-walk" class="touch-walk" role="group" aria-label="Χειριστήριο κίνησης αφής" hidden>
      <div class="touch-walk-pad"><span class="touch-walk-ring" aria-hidden="true"></span><span id="touch-walk-stick" aria-hidden="true"></span></div>
    </div>
    <p id="loading" class="loading" role="status">Φορτώνεται η Αθήνα…</p>
  </main>

  <dialog id="puzzle-dialog" aria-labelledby="puzzle-title">
    <div class="dialog-inner">
      <div class="dialog-head">
        <h2 id="puzzle-title">Αθήνα και ελληνικός πολιτισμός</h2>
        <button type="button" data-close aria-label="Κλείσιμο παζλ">Κλείσιμο</button>
      </div>
      <p id="puzzle-copy">Διάλεξε ένα κομμάτι και μετά μία θέση.</p>
      <div class="puzzle">
        <div>
          <h3>Υποδοχές</h3>
          <div id="slots" class="pieces"></div>
        </div>
        <div>
          <h3>Δίσκος</h3>
          <div id="tray" class="pieces"></div>
        </div>
      </div>
      <p id="puzzle-notice" role="status"></p>
      <div class="actions">
        <button id="puzzle-menu" type="button">Μενού</button>
        <button id="puzzle-enter" class="primary" type="button" hidden>Στους σταθμούς</button>
      </div>
    </div>
  </dialog>

  <dialog id="menu-dialog" aria-labelledby="menu-title">
    <div class="dialog-inner">
      <div class="dialog-head">
        <h2 id="menu-title">Αθήνα και ελληνικός πολιτισμός</h2>
        <button type="button" data-close autofocus>Κλείσιμο</button>
      </div>
      <section id="gate" class="menu-progress">
        <div class="level-head">
          <h3>Η εικόνα του ελληνικού πολιτισμού</h3>
          <output id="tiles-count" aria-label="Κομμάτια στη θέση τους">0 / 6</output>
        </div>
        <p id="gate-copy">Τοποθέτησε τα έξι κομμάτια στις υποδοχές.</p>
        <div class="actions">
          <button id="open-puzzle" class="primary" type="button">Άνοιγμα παζλ</button>
          <button id="enter-river" class="primary" type="button" hidden>Στους σταθμούς</button>
        </div>
      </section>
      <section id="river" class="menu-progress" hidden>
        <div class="level-head">
          <h3 id="station-title">Πνύκα</h3>
          <output id="stations-count" aria-label="Ολοκληρωμένοι σταθμοί">0 / 6</output>
        </div>
        <p id="sentence" aria-live="polite"></p>
        <div id="water-choices">
          <p>Στόχευσε το δοχείο με το όνομα που απαντά στην ερώτηση.</p>
          <div id="choices" class="actions" role="group" aria-label="Στόχευση δοχείου"></div>
        </div>
      </section>
      <p id="notice" role="status" aria-live="polite"></p>
      <button id="vr" class="primary" type="button" hidden>Είσοδος σε VR</button>
      <div id="menu-actions" class="menu-actions"></div>
      <div id="menu-content"></div>
    </div>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
